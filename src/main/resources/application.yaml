server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: bookhub-api

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/bookhub?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        '[format_sql]': false
        dialect: org.hibernate.dialect.MySQLDialect

bookhub:
  jwt:
    secret: ${JWT_SECRET:4c696e685f6368756e675f626f6f6b6875625f7365637265745f6b65795f3235365f626974735f6d696e696d756d5f73697a6521}
    access-token-expiration-seconds: ${JWT_ACCESS_TOKEN_EXPIRATION:1800}
    refresh-token-expiration-seconds: ${JWT_REFRESH_TOKEN_EXPIRATION:604800}
    reset-token-expiration-seconds: ${JWT_RESET_TOKEN_EXPIRATION:600}
    otp-expiration-seconds: ${OTP_EXPIRATION:300}
    otp-resend-interval-seconds: ${OTP_RESEND_INTERVAL:60}
    otp-daily-limit: ${OTP_DAILY_LIMIT:5}
    otp-max-attempts: ${OTP_MAX_ATTEMPTS:5}
    login-max-attempts: ${LOGIN_MAX_ATTEMPTS:5}
    login-lock-duration-seconds: ${LOGIN_LOCK_DURATION:900}

  vnpay:
    tmn-code: ${VNPAY_TMN_CODE:BOOKHUB}
    hash-secret: ${VNPAY_HASH_SECRET:}
    pay-url: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
    return-url: ${VNPAY_RETURN_URL:https://your-domain.com/checkout/result}

  order:
    vnpay-timeout-minutes: ${ORDER_VNPAY_TIMEOUT_MINUTES:15}
    bank-transfer-timeout-hours: ${ORDER_BANK_TRANSFER_TIMEOUT_HOURS:48}

  user:
    max-addresses: ${CUSTOMER_MAX_ADDRESSES:10}

  media:
    max-file-size-mb: ${MEDIA_MAX_FILE_SIZE_MB:5}
    max-batch-files: ${MEDIA_MAX_BATCH_FILES:10}
    cdn-base-url: ${MEDIA_CDN_BASE_URL:https://cdn.bookhub.vn}


